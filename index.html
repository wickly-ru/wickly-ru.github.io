alse, "locked": true}, {"id": 30, "module": "Liquidity / SMC", "title": "FVG - Fair Value Gap", "summary": "Как устроена распространённая трёхсвечная разметка.", "visual": "fvg", "free": false, "locked": true}, {"id": 31, "module": "Liquidity / SMC", "title": "Order Block", "summary": "Почему Order Block имеет несколько трактовок.", "visual": "orderblock", "free": false, "locked": true}, {"id": 32, "module": "Liquidity / SMC", "title": "Imbalance и Mitigation", "summary": "Как понимать финальные термины SMC без магического мышления.", "visual": "mitigation", "free": false, "locked": true}, {"id": 33, "module": "Паттерны", "title": "Double Top и Double Bottom", "summary": "Как отличать двухвершинную конструкцию от обычного диапазона.", "visual": "double-top", "free": false, "locked": true}, {"id": 34, "module": "Паттерны", "title": "Head and Shoulders", "summary": "Разбираем голову, плечи и neckline как геометрию.", "visual": "head-shoulders", "free": false, "locked": true}, {"id": 35, "module": "Паттерны", "title": "Triangles, Wedges, Flags и Pennants", "summary": "Как различать геометрические конструкции и их контекст.", "visual": "triangle", "free": false, "locked": true}, {"id": 36, "module": "Индикаторы", "title": "Moving Average и EMA", "summary": "Как средние сглаживают цену и почему они запаздывают.", "visual": "moving-average", "free": false, "locked": true}, {"id": 37, "module": "Индикаторы", "title": "RSI: что измеряет и чего не измеряет", "summary": "Почему 30/70 нельзя превращать в кнопку разворота.", "visual": "rsi-panel", "free": false, "locked": true}, {"id": 38, "module": "Индикаторы", "title": "MACD", "summary": "Как читать разницу сглаженных средних и её изменения.", "visual": "macd-panel", "free": false, "locked": true}, {"id": 39, "module": "Индикаторы", "title": "Volume и VWAP", "summary": "Как использовать объём как описание активности, а VWAP - как объёмно-взвешенную среднюю.", "visual": "volume-vwap", "free": false, "locked": true}, {"id": 40, "module": "Риск и психология", "title": "Риск как отдельная дисциплина", "summary": "Почему результат зависит не только от направления движения.", "visual": "risk-framework", "free": false, "locked": true}, {"id": 41, "module": "Риск и психология", "title": "Дневник и backtest", "summary": "Как превращать отдельные решения в данные для обучения.", "visual": "journal-backtest", "free": false, "locked": true}, {"id": 42, "module": "Риск и психология", "title": "Ожидаемость, серии и просадка", "summary": "Почему один результат ничего не говорит о качестве системы.", "visual": "expectancy", "free": false, "locked": true}, {"id": 43, "module": "Риск и психология", "title": "Когнитивные ошибки и взгляд из будущего", "summary": "Как не позволить памяти превратить прошлый график в «очевидный» прогноз.", "visual": "hindsight", "free": false, "locked": true}, {"id": 44, "module": "Финальный разбор", "title": "Финальный разбор графика", "summary": "Собираем рынок, структуру, инструменты и проверку в одну учебную процедуру.", "visual": "full-cycle", "free": false, "locked": true}], "lessons": {"1": {"id": 1, "module": "Рынок", "title": "Как устроен финансовый рынок", "summary": "Разбираемся, что происходит между заявкой участника и тем, что ты видишь на графике.", "visual": "exchange-flow", "free": true, "locked": false, "sections": [["Что такое рынок и зачем он нужен", "Рынок - это место (чаще всего электронное), где люди и компании меняют одни вещи на другие по согласованной цене. На финансовом рынке меняют деньги на акции, валюту, облигации, фьючерсы, криптовалюту. Продавец хочет получить деньги, покупатель хочет получить актив. Пока у них совпадает мнение о цене, сделка происходит.\n\nВажно понять с самого начала: рынок нужен не для того, чтобы «играть против трейдеров». У него есть реальные задачи. Компания выпускает акции, чтобы привлечь деньги на развитие. Государство выпускает облигации, чтобы занять деньги. Экспортёр продаёт валюту, чтобы заплатить зарплаты в рублях. Фермер продаёт будущий урожай заранее, чтобы знать, сколько он заработает. Трейдеры - лишь одна из групп участников, и далеко не самая большая.\n\nПоэтому, когда ты смотришь на график, ты видишь не «борьбу злых маркетмейкеров с тобой», а суммарный результат решений тысяч людей с совершенно разными целями. У одного цель - вложить деньги на десять лет, у другого - закрыть риск по контракту, у третьего - заработать на колебании за пять минут. Цена - это то место, где их интересы на мгновение совпали."], ["Откуда берётся цена: аукцион заявок", "Цену не назначает ни биржа, ни брокер, ни какой-то «главный игрок». Она возникает из заявок. Заявка - это сообщение вида «я готов купить 100 акций не дороже 250 рублей» или «я готов продать 50 акций не дешевле 251 рубля». Все такие сообщения собираются в общий список - стакан заявок (подробно о нём будет урок 4).\n\nСделка происходит в момент, когда лучшая цена покупателя встречается с лучшей ценой продавца. Покупатель согласен платить 250, продавец хочет минимум 251 - сделки нет, они «не договорились». Как только кто-то уступит (покупатель поднимет цену до 251 или продавец опустит до 250), появится сделка. Цена последней сделки - это та самая «цена актива», которую ты видишь в приложении.\n\nОтсюда простой вывод: цена меняется не потому, что «рынок решил», а потому, что кто-то оказался более нетерпеливым. Если покупателям нужно купить прямо сейчас, они вынуждены соглашаться на цену продавцов - и цена идёт вверх. Если срочно нужно продавать, продавцы соглашаются на цену покупателей - цена идёт вниз."], ["Пример с числами: как цена сдвигается на копейки и рубли", "Возьмём условную акцию. Сейчас у покупателей лучшая цена 250,00, у продавцов 250,10. Последняя сделка прошла по 250,05 - график показывает эту цифру.\n\nПриходит крупный покупатель и хочет купить 5 000 акций «по рынку», то есть как можно скорее. У продавцов по 250,10 стоит всего 800 акций. Он выкупает их. Следующий уровень продавцов - 250,20, там 1 200 акций. Выкупает и их. Дальше 250,30 - 1 500 акций, и так далее, пока не наберёт 5 000. Его средняя цена получилась выше начальной, а сама цена теперь, скажем, 250,40.\n\nЧто произошло? Никто «не решил» поднять цену. Просто один участник съел несколько уровней продавцов, и последняя сделка оказалась на более высоком уровне. Если после этого новых покупателей нет, а продавцы подтягиваются, цена вернётся обратно. Если покупатели продолжают приходить, цена пойдёт дальше вверх. Весь рост и падение на графике устроены именно так: серия сделок, которые «съедают» заявки с одной стороны."], ["Что делает рынок растущим или падающим", "Простая модель: цена растёт, когда агрессивных покупателей больше, чем продавцов готовых уступить, и падает, когда наоборот. «Агрессивный» значит тот, кто покупает или продаёт сразу по текущей лучшей цене, не ожидая в очереди.\n\nПричины, по которым агрессивных покупателей становится больше, бывают разные: вышла хорошая отчётность компании, центральный банк снизил ставку, упала цена на сырьё, которое компания тратит, пришли новости об отмене санкций, фонд решил увеличить долю в этом активе. Причины падения зеркальные. Но есть и «технические» причины: сработали стоп-заявки, закончился срок фьючерса, фонд перебалансирует портфель в конце квартала. Ни одна из этих причин не видна на графике напрямую - на графике видно только последствие в виде движения цены.\n\nЭто очень важный момент для новичка. График не объясняет, ПОЧЕМУ цена двигалась. Он показывает только, КАК она двигалась. Поэтому любые истории вида «цена выросла, потому что...» почти всегда придуманы задним числом."], ["Кто зарабатывает и кто теряет", "Каждая сделка имеет две стороны: если ты купил, кто-то продал. Но из этого не следует, что один обязательно проиграл. Долгосрочный инвестор может купить у спекулянта, оба получат то, что хотели: один - актив на годы, второй - небольшую прибыль за час.\n\nЗато у любой торговли есть издержки. Брокер берёт комиссию, биржа берёт сбор, между ценой покупки и ценой продажи есть спред (урок 4). Эти издержки платят все, независимо от результата. Поэтому у частного трейдера, который часто входит и выходит, итог всегда немного хуже, чем «рынок в среднем». Если ты делаешь 20 сделок в день и платишь на каждой 0,05 %, то за месяц отдашь комиссиями больше, чем многие инвесторы платят за год.\n\nВывод без драматизма: трейдинг - это не лотерея, но и не простая работа. Чтобы быть в плюсе, нужна стратегия, где средняя прибыль больше средних издержек и убытков. Этому и посвящён курс: сначала понять, как устроен рынок, потом - как читать график, потом - как управлять риском."], ["Что график показывает и чего не показывает", "График показывает: какие цены были, в какое время, сколько торговалось (объём), как быстро цена менялась. Это факты прошлого, и они не искажаются, если источник данных надёжный.\n\nГрафик НЕ показывает: чьи именно это были сделки, зачем их совершили, что планирует делать тот же участник дальше, какие новости выйдут через час, какие большие заявки стоят в стороне и ещё не исполнены. Поэтому разговоры о том, что «умные деньги заходят» или «крупный игрок собирает позицию», - это всегда предположения, а не наблюдения. Предположения можно проверять и использовать, но нельзя выдавать за факты.\n\nПрактичная привычка с первого дня: разделяй то, что ты видишь («цена пробила уровень 250 и закрылась выше»), и то, что ты придумал («значит, покупатели победили»). Первое проверяемо, второе - гипотеза. Сайт и учит этому различию."], ["Типичные ошибки новичка в первый месяц", "Ошибка первая: считать, что цена имеет «правильное» значение, к которому она обязательно вернётся. Нет, цена - это просто последняя согласованная сделка, а не справедливая оценка.\n\nОшибка вторая: искать виновного. «Меня выбило по стопу, это рынок против меня». Рынок не знает о твоём стопе. Твоя заявка была одной из тысяч, и цена просто прошла через этот уровень.\n\nОшибка третья: торговать без понимания, кто стоит по другую сторону. Если ты покупаешь на самом пике новостного движения, то продаёт тебе тот, кто как раз купил заранее и рад зафиксировать прибыль.\n\nОшибка четвёртая: путать график с прогнозом. Линия слева направо выглядит как «история, которая продолжится», но следующая свеча никак не связана с твоим желанием. Подходи к графику как к карте местности, а не как к хрустальному шару."]], "remember": ["Цена возникает из заявок участников: сделка происходит, когда лучшая цена покупки встречается с лучшей ценой продажи.", "График показывает, КАК двигалась цена, но не объясняет, ПОЧЕМУ - причины почти всегда восстанавливаются задним числом.", "Комиссии и спред платят все участники, поэтому частому трейдеру нужна стратегия, где средний плюс больше издержек."], "quiz": [["Лучший Bid 250,00, у продавцов: 800 акций по 250,10 и 1 200 по 250,20. Покупатель отправляет рыночную заявку на 1 500 акций. Что произойдёт?", ["Купит 800 по 250,10, а остаток в 700 акций отменится, так как рыночная заявка не может занимать второй ценовой уровень", "Купит все 1 500 по 250,10, потому что именно эта цена была лучшей в момент отправки, а остальное биржа допоставит позже", "Купит все 1 500 по среднему между лучшим Bid и лучшим Ask, то есть примерно по 250,05, согласно правилу биржи", "Купит 800 по 250,10 и 700 по 250,20; последняя цена станет 250,20, а у продавцов на этом уровне останется 500 акций"], 3, "Рыночная заявка идёт по стакану уровень за уровнем. Средняя цена получится около 250,15, а последняя сделка пройдёт по 250,20. Единой «средней цены от биржи» не существует."], ["Акция выросла на 3 % за 20 минут без новостей. Какое объяснение является наблюдением, а не домыслом?", ["За 20 минут покупатели исполняли заявки по всё более высоким ценам, поэтому последняя сделка оказалась выше прежних", "Рост начался, потому что крупный фонд тихо набирает позицию и готовится к публикации хорошей отчётности компании", "Рост вызвала утечка инсайдерской информации, которую рынок учёл заранее, поэтому причина скоро станет известна всем", "Рост произошёл из-за того, что биржа решила поднять котировку, чтобы привлечь внимание к бумаге и увеличить обороты"], 0, "На графике видны только цены и объёмы. «Фонд готовится», «утечка» и «решение биржи» - предположения о причинах, которых график не показывает."], ["Трейдер совершает 25 сделок в день, комиссия и спред в сумме съедают 0,12 % оборота за круг. Стратегия приносит в среднем 0,10 % на сделку до издержек. Что верно?", ["Издержки списываются только с убыточных сделок, поэтому на средней прибыли они заметно не скажутся в итоге", "Стратегия прибыльна, поскольку 0,10 % за сделку на 25 сделках даёт 2,5 % в день, а издержки платит биржа", "В среднем каждая сделка приносит убыток 0,02 %, поэтому стратегия проигрывает даже при внешне удачных днях", "Результат зависит только от направления рынка, а издержки при частой торговле выравниваются и сводятся к нулю"], 2, "Издержки платятся за каждую сделку независимо от результата: 0,10 % − 0,12 % = −0,02 % на круг. 25 таких сделок в день дают стабильный минус."], ["Тебя выбило по стопу, после чего цена сразу пошла в твою сторону. Какой вывод самый обоснованный?", ["Это случайность, которую не нужно разбирать, поскольку любой стоп выбивается примерно в половине случаев одинаково", "Рынок увидел твою заявку и намеренно сдвинул цену, значит, стоп нужно прятать и держать только в голове", "Это доказывает, что стопы вредны, и без них позиция дождалась бы разворота и принесла бы прибыль в итоге", "Нужно проверить, стоял ли стоп в зоне обычного шума цены, а не считать, что рынок целенаправленно выбил именно тебя"], 3, "Рынок не знает о конкретной заявке. Полезный вопрос: соответствовало ли расстояние до стопа обычной амплитуде колебаний. Остальные выводы закрепляют вредные привычки."], ["Почему утверждение «цена упала, потому что вышли плохие новости» нельзя считать фактом, глядя только на график?", ["График показывает новости в виде специальных меток, но они могут быть неточными, поэтому им нельзя полностью доверять", "На графике видна только последовательность цен, а связь с новостью - это объяснение, добавленное уже после движения", "Плохие новости всегда вызывают рост, потому что участники покупают на панике, поэтому формулировка в корне неверна", "Новости никогда не влияют на цену, ведь её определяют только заявки, а информация участникам заранее известна"], 1, "Новости могут влиять на решения участников, но график этого не доказывает: цена могла упасть по другим причинам. Связь - гипотеза."], ["Два участника: инвестор покупает акции на 10 лет, спекулянт продаёт их же через час с небольшой прибылью. Кто из них «проиграл» в этой сделке?", ["Проиграл спекулянт, потому что инвестор получил актив на долгий срок, а значит, оценил его справедливее", "Проиграл инвестор, потому что спекулянт всегда зарабатывает за его счёт, пользуясь более быстрой реакцией", "Не обязательно никто: у участников разные цели и горизонты, и каждый мог получить именно то, что хотел", "Проиграл тот, кто заплатил больше комиссии, поскольку итог любой сделки определяется только размером издержек"], 2, "Сделка не обязана быть игрой с нулевой суммой для целей участников. Оценка зависит от горизонта и задачи, а не от одной цены."]]}, "2": {"id": 2, "module": "Рынок", "title": "Участники и их задачи", "summary": "Разбираем, кто присутствует на рынке, зачем им сделки и почему по графику нельзя читать чужие намерения напрямую.", "visual": "participants-map", "free": true, "locked": false, "sections": [["Зачем знать, кто торгует рядом с тобой", "Когда ты нажимаешь «Купить», в другой стороне сделки стоит конкретный участник со своей целью. Если не понимать, кто это и чего он хочет, легко придумать себе врага или, наоборот, ложную опору. Поэтому прежде чем читать графики, полезно разобраться с составом игроков.\n\nВсех участников можно разделить по горизонту и цели. Горизонт - на сколько времени человек или компания собираются держать позицию: минуты, дни, годы. Цель - что для них важно: заработать на колебании, сохранить капитал, застраховать бизнес, обслужить клиентов.\n\nНи один из игроков не «главный». Но у разных игроков разный размер денег, разная скорость реакции и разная чувствительность к цене. Эти различия определяют, как на графике появляются движения, пробои, откаты и «пустые» зоны."], ["Частные трейдеры и розничные инвесторы", "Это обычные люди с брокерским счётом: от нескольких тысяч рублей до миллионов. Часть из них покупает акции и держит годами, часть торгует внутри дня. Их главная особенность - небольшие объёмы, из-за которых один человек практически не двигает цену. Зато вместе розничные участники на отдельных рынках дают заметный процент оборота, особенно в криптовалютах и в акциях, о которых активно говорят в соцсетях.\n\nСильная сторона частного трейдера - гибкость. Он не обязан отчитываться перед клиентами, может ждать месяц без сделок и не должен покупать любой ценой. Слабая - эмоции и нехватка информации: страх упустить рост, желание отыграться, привычка закрывать прибыль слишком рано и держать убыток слишком долго.\n\nПрактическое следствие: массовые «очевидные» входы (например, все видят один и тот же уровень и ставят заявки у него) создают скопления заявок. Об этом подробно пойдёт речь в модуле про ликвидность."], ["Институциональные игроки: фонды, банки, страховые компании", "Это организации, которые управляют чужими деньгами: паевые и пенсионные фонды, страховые компании, банки, хедж-фонды. Их капитал измеряется миллиардами, и именно это определяет их поведение.\n\nКрупный фонд не может купить на миллиард одной заявкой: цена ушла бы вверх ещё в процессе покупки. Поэтому он дробит заявку на тысячи частей и покупает неделями или даже месяцами, подстраиваясь под текущий объём торгов. Для графика это означает, что серьёзные движения не всегда выглядят как один резкий скачок. Часто это медленный, упорный подъём или спад, который со стороны кажется «ничего особенного».\n\nЕщё одна важная деталь: у большинства институционалов жёсткие правила риска. Если актив упал на определённый процент, они обязаны сократить позицию. Это может запускать цепочки продаж, которые кажутся «паникой», но на деле являются выполнением регламента."], ["Маркет-мейкеры и высокочастотные трейдеры", "Маркет-мейкер - участник, который постоянно выставляет и заявку на покупку, и заявку на продажу по одному активу. Его заработок - разница между ценами (спред) на огромном количестве мелких сделок. Он не пытается угадать направление: ему важно быстро проходить через позицию, а не держать её.\n\nБлагодаря маркет-мейкерам ты можешь купить и продать акцию в любой момент без долгих поисков партнёра. Это и есть ликвидность. В то же время они защищают себя: если рынок стремительно движется, они расширяют спред или временно убирают заявки. Поэтому во время важных новостей спред на графике вдруг «разъезжается».\n\nВысокочастотные фирмы (HFT) делают похожую работу, но на скоростях миллисекунд. Для обычного трейдера это означает простое: на очень коротких таймфреймах (секунды) цена «шумит» по причинам, которые человеческий глаз не может проанализировать. Именно поэтому новичкам советуют не начинать с секундных графиков."], ["Хеджеры и корпоративные участники", "Хеджеры - те, кто использует рынок для страховки реального бизнеса, а не ради прибыли от самой сделки. Авиакомпания покупает фьючерсы на топливо, чтобы цена керосина не разрушила бюджет. Экспортёр продаёт валютные контракты, чтобы курс не обвалил выручку. Для них сделка успешна, даже если «в минус» на бирже, потому что она защитила основной бизнес.\n\nТакой участник готов заплатить за определённость, поэтому его заявки не всегда «разумны» с точки зрения чистой прибыли. Он может купить дороже или продать дешевле, потому что ему нужна гарантированная цена, а не угадывание.\n\nЕсть и корпоративные сделки: компания выкупает свои акции, менеджеры продают пакет акций по заранее объявленному графику, государство размещает облигации. Все эти операции создают устойчивый спрос или предложение, не связанный с «технической картиной»."], ["Как состав участников отражается на графике", "Разные игроки оставляют разный след. Мелкие трейдеры создают шум: короткие колебания, ложные пробои, внезапные разгоны на слухах. Институционалы формируют долгие направленные движения и крупные зоны, где цена «топчется», потому что они накапливают или распределяют позицию. Маркет-мейкеры сглаживают разницу между ценами и растягивают спред при опасности. Хеджеры иногда создают всплески в определённые даты, например перед экспирацией контрактов.\n\nИменно поэтому один и тот же паттерн на пятиминутке и на дневке означает разное. На маленьком таймфрейме преобладают быстрые игроки, на большом - медленные деньги с долгим горизонтом. В уроке про таймфреймы мы вернёмся к этой идее.\n\nЗапомни базовое правило: прежде чем делать вывод по графику, спрашивай себя - «кому это движение было выгодно и на какой срок?». Даже если точного ответа нет, сама привычка задавать вопрос защищает от наивных решений."], ["Ошибки, связанные с представлением об участниках", "Миф первый: «все крупные игроки охотятся за мелкими». На практике институционал заботится об исполнении своих заявок с минимальным влиянием на цену, а не о вашем стопе. Если вы оказались на пути его покупки, это совпадение, а не охота.\n\nМиф второй: «я вижу, что делают умные деньги». Видны лишь итоговые цены и объёмы. Любая «расшифровка намерений» - гипотеза.\n\nМиф третий: «рынком управляет один оператор». Даже самые крупные игроки на ликвидных рынках не контролируют цену надолго: другие участники реагируют и ломают их планы.\n\nПравильная позиция: рынок - это экосистема. Знание о составе игроков помогает формулировать осторожные гипотезы и понимать масштаб рисков, но не делает график читаемым как открытая книга."]], "remember": ["Участники различаются горизонтом и целью: частные трейдеры, институционалы, маркет-мейкеры, хеджеры.", "Крупные игроки дробят заявки и действуют неделями, поэтому серьёзные движения часто выглядят как медленный упорный ход.", "Разговоры об «умных деньгах» - гипотезы; на графике видны только цены и объёмы, не намерения."], "quiz": [["Фонд хочет купить акций на 2 млрд рублей, а средний дневной оборот бумаги - 500 млн. Как он, скорее всего, поступит?", ["Купит всё одной крупной рыночной заявкой в начале сессии, чтобы получить лучшую среднюю цену за счёт скорости", "Выставит одну лимитную заявку на весь объём и будет ждать, пока рынок сам придёт к его цене за пару часов", "Растянет покупку на недели, разбивая заявки на мелкие части и подстраиваясь под текущий объём торгов", "Дождётся важной новости и купит весь пакет сразу по рынку, когда спреды и объёмы будут наибольшими за день"], 2, "Такая заявка сама сдвинет цену. Поэтому институционалы дробят покупки и растягивают их по времени, и на графике это выглядит как спокойный упорный рост."], ["Во время выхода важной статистики спред по валютной паре вырос с 0,3 до 2 пунктов. Что это, скорее всего, означает?", ["Брокер временно повысил комиссию всем клиентам, чтобы компенсировать рост нагрузки на серверы во время новости", "Биржа ввела штраф за торговлю в момент публикации данных и переложила его на всех покупателей через спред", "Все частные трейдеры одновременно отменили заявки, и в стакане остались только заявки крупных банков по справедливой цене", "Маркет-мейкеры защищают себя от риска торговли по устаревшим ценам и расширяют разницу между покупкой и продажей"], 3, "Маркет-мейкеры при неопределённости расширяют спред или убирают заявки. Торговля в такой момент дороже, поэтому многие её избегают."], ["Авиакомпания хеджирует расходы на топливо фьючерсами. Топливо подешевело, и фьючерс принёс убыток. Как оценить хедж?", ["Он провалился, потому что любая сделка с убытком означает ошибку и должна быть немедленно закрыта руководством", "Он сработал: убыток по фьючерсу компенсируется более дешёвым топливом, а бюджет компании остался предсказуемым", "Он был бессмысленным, ведь участники рынка торгуют только ради прибыли и никогда не страхуют реальный бизнес", "Он сработал только наполовину, так как хедж обязан приносить прибыль на бирже независимо от цены на топливо"], 1, "Цель хеджа - зафиксировать цену, а не заработать на самой сделке. Потеря на фьючерсе уравновешивается экономией на реальных закупках."], ["В стакане появилась «стена» на 50 000 лотов под ценой, и цена три раза отскочила от неё. Затем стена исчезла без единой сделки. Что это показывает?", ["Это сбой терминала, так как заявки такого размера нельзя ни выставить, ни отменить без разрешения биржи", "Стену исполнили скрытыми сделками, которые не попали в ленту, и именно поэтому она исчезла так внезапно", "Лимитные заявки можно снять в любой момент, поэтому стена показывала намерение, но не обязательство удерживать цену", "Участник проиграл битву за уровень, и теперь цена обязательно упадёт в тот же день до следующей поддержки"], 2, "Стена - это просто заявки, которые видны, пока их не отменили. Информацию о реальном спросе дают состоявшиеся сделки, а не обещания в стакане."], ["Трейдер уверен: «рост на графике - это крупный игрок собирает позицию». Что единственное он может утверждать, опираясь на график?", ["Что цена росла при таком-то объёме, а кто и зачем покупал, остаётся гипотезой, которую нужно проверять отдельно", "Что объём на росте всегда принадлежит покупателям, поэтому доля покупателей легко считается из столбцов объёма", "Что на следующей свече цена продолжит рост, поскольку позицию такого размера набирают не меньше недели", "Что покупает именно фонд, так как только фонды способны вызвать устойчивый рост без откатов более двух дней"], 0, "Объём - это сумма сделок, в каждой из которых есть и покупатель, и продавец. Личность участника и его планы по графику узнать нельзя."], ["Один и тот же двойной максимум на 5-минутном и на дневном графике: почему его значимость разная?", ["На дневном графике свечи рисуются по другим ценам, поэтому формация там выглядит иначе, чем на минутках", "На коротком графике преобладают быстрые игроки и шум, на дневном - решения с длинным горизонтом и большими деньгами", "Значимость одинакова: форма определяется только расстоянием между вершинами, а не временным масштабом графика", "На 5-минутном графике двойных максимумов не бывает, так как биржа не показывает сделки чаще раза в час"], 1, "Состав участников на разных масштабах разный. Движение, накопленное за дни, отражает более весомые решения, чем колебания в несколько минут."]]}, "3": {"id": 3, "module": "Рынок", "title": "Биржа, брокер и торговая инфраструктура", "summary": "Разделяем биржу, брокера, источник котировок и исполнение, чтобы не смешивать разные уровни системы.", "visual": "broker-link", "free": true, "locked": false, "sections": [["Из чего состоит путь заявки", "Когда ты нажимаешь «Купить» в приложении, заявка проходит короткую, но важную цепочку. Приложение отправляет её брокеру. Брокер проверяет, хватает ли денег и разрешена ли такая операция. Затем заявка уходит на биржу. Биржа сопоставляет её с чужими заявками. Если находится встречная, происходит сделка. Информация о ней возвращается обратно к брокеру, а затем в приложение, и ты видишь, что позиция открыта.\n\nВсё это занимает доли секунды, но у каждого звена своя роль и свои риски. Если не разделять эти роли, легко принять сбой брокера за поведение рынка или перепутать комиссию брокера с комиссией биржи.\n\nВ этом уроке мы разберём каждое звено: биржу, брокера, клиринг и депозитарий, торговый терминал. И заодно обсудим, как выбирать брокера и на что смотреть в договоре."], ["Биржа: место, где встречаются заявки", "Биржа - это организатор торгов. Она не покупает и не продаёт активы для себя. Её задача - свести заявки по правилам, чтобы сделка была честной и прозрачной. Именно биржа определяет, какие инструменты торгуются, в какое время идут торги, какой минимальный шаг цены, какие лимиты на резкие скачки.\n\nБиржа публикует рыночные данные: цены, объёмы, стакан. По ним строятся графики. Данные могут быть задержанными (бесплатные источники часто дают котировки с задержкой 15 минут) и реальными (платная подписка). Для долгосрочного инвестора задержка почти не важна, а для внутридневной торговли может быть критичной.\n\nПримеры бирж: Московская биржа (акции, облигации, валюта, фьючерсы), NYSE и Nasdaq в США, Binance и другие криптобиржи. Каждая работает по своим правилам и расписанию. Например, акции на Мосбирже торгуются в основной сессии с утра до вечера, плюс есть вечерняя сессия с меньшей ликвидностью."], ["Брокер: посредник между тобой и биржей", "Обычный человек не может напрямую подключиться к бирже - это доступно только лицензированным участникам. Брокер как раз такой участник. Он открывает тебе счёт, принимает деньги, передаёт твои заявки на биржу и отчитывается о сделках. Взамен берёт комиссию.\n\nОбязанности брокера: хранить учёт твоих активов, исполнять заявки, удерживать и перечислять налог (для граждан РФ брокер обычно выступает налоговым агентом), предоставлять терминал для торговли. Важно: честный брокер не торгует против клиента. Но он может зарабатывать на плече (кредитовании) и на комиссиях, поэтому у него есть стимул, чтобы клиент торговал чаще.\n\nПроверять брокера нужно по нескольким признакам: наличие лицензии Банка России, реестр на сайте ЦБ, отзывы за годы, а не за месяцы, понятные тарифы. Не стоит верить обещаниям «гарантированной доходности» и «обучению с вашей прибылью»: это типичные признаки мошенничества."], ["Клиринг и депозитарий: невидимые звенья", "После сделки нужно, чтобы покупатель получил актив, а продавец - деньги. Этим занимается клиринговая организация (на Мосбирже - Национальный клиринговый центр). Она выступает посредником для обеих сторон и берёт на себя риск, что одна из них не выполнит обязательства. Благодаря этому можно спокойно торговать с незнакомцами.\n\nДепозитарий хранит записи о том, кому принадлежат ценные бумаги. Когда ты покупаешь акцию, ты не получаешь бумажный документ, а в электронном реестре появляется запись, что эта акция числится за тобой. Это снижает риск потери и ускоряет расчёты.\n\nРасчёты по акциям в России идут по схеме T+1: сделка заключается сегодня, а окончательный обмен деньгами и бумагами происходит на следующий рабочий день. Для обычного клиента это почти незаметно, но стоит помнить, что деньги от продажи могут быть недоступны для вывода сразу."], ["Торговый терминал и тип заявок", "Терминал - это программа, через которую ты видишь графики и отправляешь заявки. Он может быть встроен в приложение брокера (Тинькофф Инвестиции, Сбербанк Инвестор и т. д.) или быть отдельным ПО (QUIK, MetaTrader, TradingView с подключением). Сам по себе терминал не делает тебя лучше как трейдера: он лишь инструмент.\n\nОсновные типы заявок. Рыночная: купи или продай прямо сейчас по лучшей доступной цене. Быстро, но цена исполнения может отличаться от ожидаемой. Лимитная: купи не дороже или продай не дешевле указанной цены. Цена контролируется, но заявка может не исполниться. Стоп-заявка: срабатывает, когда цена достигает заданного уровня, и превращается в рыночную или лимитную. Часто используется для ограничения убытка.\n\nПеред первой сделкой стоит потренироваться на демо-счёте или с минимальной суммой: понять, где кнопка, как выглядит подтверждение, как отменить заявку. Много потерь у новичков связано не с рынком, а с ошибкой интерфейса."], ["Издержки: из чего складывается стоимость сделки", "Полная стоимость операции состоит из нескольких частей. Комиссия брокера - обычно процент от суммы сделки (например, 0,05 %). Комиссия биржи - небольшая, но есть. Спред - разница между лучшей ценой покупки и продажи; ты фактически платишь её при входе по рынку. Проскальзывание - отличие цены исполнения от ожидаемой. Плата за обслуживание счёта у некоторых тарифов. Налоги: в России 13-15 % с прибыли, брокер обычно удерживает сам.\n\nПример. Ты купил 100 акций по 250 рублей, на сумму 25 000 рублей. Комиссия 0,05 % - это 12,5 рубля при покупке и столько же при продаже. Спред пусть 0,10 рубля на акцию, то есть 10 рублей. Итого около 35 рублей на круг, или 0,14 % от суммы. Чтобы просто выйти в ноль, цене нужно вырасти минимум на эти 0,14 %. Для краткосрочных сделок это очень заметно.\n\nВывод: прежде чем сравнивать стратегии, посчитай издержки. Иногда «рабочая» идея на графике перестаёт давать плюс, как только учтены комиссии."], ["Риски инфраструктуры и ошибки новичков", "Технические риски: сбой интернета, зависание приложения, задержка исполнения. Решение - знать, как отменить заявки через альтернативный канал (телефон, вторая платформа), и не держать большую позицию без стопа на сервере брокера.\n\nОперационные риски: ошибка в количестве лотов, перепутанная кнопка, торговля не тем инструментом. Решение - проверять тикер и размер перед отправкой и начинать с малых сумм.\n\nПравовые риски: нелицензированный «брокер», обещания дохода, просьба перевести деньги на физическое лицо. Решение - проверка лицензии ЦБ, договор, отказ от переводов на личные карты.\n\nТипичные ошибки новичков: путают брокера и биржу («биржа взяла комиссию» - на самом деле брокер), не читают тарифы, торгуют на плече, не понимая, что такое маржинальный вызов, не проверяют, когда деньги от продажи станут доступны. Спокойно разберись с этими вещами до первой серьёзной сделки."]], "remember": ["Путь заявки: терминал → брокер → биржа → клиринг и депозитарий; у каждого звена своя роль и свои риски.", "Полная стоимость сделки - это комиссия, спред, проскальзывание и налог, а не только процент брокера.", "Лицензию брокера проверяют в реестре ЦБ; обещание гарантированной доходности - признак обмана."], "quiz": [["Покупка 400 акций по 250 ₽. Комиссия брокера 0,05 % с каждой операции, спред 0,10 ₽ на акцию, покупка и продажа по рынку. Ориентировочно на сколько процентов должна вырасти цена, чтобы выйти в ноль?", ["Около 0,05 %: платится только комиссия при покупке, а при продаже брокер ничего не берёт", "Около 0,14 %: две комиссии по 0,05 % плюс спред около 0,04 % от цены", "Ровно 0 %: спред и комиссии учитываются только при выводе денег со счёта", "Около 0,5 %: брокеры закладывают запас на проскальзывание, и он составляет полпроцента"], 1, "Комиссия взимается дважды (вход и выход) - это 0,10 %, спред 0,10 ₽ от 250 ₽ - ещё 0,04 %. Итого порядка 0,14 %."], ["Ты поставил лимитную заявку на покупку по 249,90, а цена сейчас 250,10 и идёт вверх. Что с вероятностью произойдёт?", ["Заявка автоматически превратится в рыночную через минуту, чтобы сделка не сорвалась и клиент не остался без позиции", "Заявка отменится сразу после отправки, так как лимитные заявки нельзя ставить ниже текущей цены рынка", "Заявка останется в очереди, и если цена не вернётся к 249,90, ты не купишь актив и не потеряешь деньги", "Заявка исполнится по 250,10, поскольку брокер обязан исполнить её по лучшей доступной цене"], 2, "Лимитная заявка гарантирует цену, но не исполнение. Если рынок ушёл, сделка просто не состоится."], ["Брокер пишет: «Гарантируем 15 % в месяц, переведите деньги на карту менеджера для зачисления на счёт». Что из этого следует?", ["Это признаки мошенничества: гарантия доходности и просьба перевести деньги физическому лицу не бывают у лицензированных брокеров", "Это нормальное предложение небольшого брокера, достаточно запросить скан лицензии и убедиться, что на нём стоит печать", "Это обычная реклама, а гарантия доходности возможна при низком риске, когда брокер страхует клиентов своим капиталом", "Это допустимо, если менеджер уже показывал тебе прибыль на демо-счёте и ответил на вопросы в мессенджере"], 0, "Лицензированный брокер не гарантирует доход и принимает деньги только на счета компании. Это базовая проверка перед любым переводом."], ["Ты продал акции в понедельник утром и хочешь сразу вывести деньги, но брокер показывает их как недоступные до вторника. Это значит, что…", ["…сделка не состоялась, поскольку продажа не подтверждена биржей и вскоре будет отменена автоматически", "…расчёты по сделке завершаются на следующий рабочий день (T+1), поэтому вывод возможен позже", "…на счёте нет достаточной суммы, поэтому брокер ограничил вывод до пополнения счёта на минимальный остаток", "…брокер удерживает твои деньги, чтобы заработать на них, и по закону обязан вернуть их через месяц"], 1, "По акциям действует схема T+1: окончательный обмен деньгами и бумагами проходит на следующий рабочий день."], ["Приложение зависло после нажатия «Купить», и ты не видишь, прошла ли заявка. Какое действие самое безопасное?", ["Сразу открыть противоположную позицию, чтобы застраховаться, поскольку покупка могла пройти или не пройти", "Нажать «Купить» ещё раз, чтобы наверняка получить позицию, а лишнюю потом продать без потерь по текущей цене", "Закрыть приложение и ждать час, не проверяя счёт, потому что система сама разберётся и исправит ошибки", "Проверить позицию и статус заявок через другой канал (веб-версия, телефон брокера) и только потом действовать дальше"], 3, "Повторная отправка может удвоить позицию, а встречная сделка создаёт лишние издержки. Сначала нужно узнать фактическое состояние счёта."], ["В чём разница между функциями биржи и брокера?", ["Биржа сводит заявки по правилам и публикует данные, а брокер даёт тебе доступ, учитывает счёт и передаёт заявки на биржу", "Это одно и то же юридическое лицо, а разные названия используются только для рекламы разных тарифов", "Биржа торгует против клиентов, а брокер защищает их интересы и гарантирует исполнение любых заявок по лучшей цене", "Биржа открывает клиентам счета и берёт комиссию, а брокер лишь публикует котировки и следит за порядком торгов"], 0, "Биржа - организатор торгов, брокер - лицензированный посредник между клиентом и биржей. Путаница между ними ведёт к неверным ожиданиям по комиссиям и рискам."]]}}};

function lineDiagram(opts){
  const W=900,H=340,padL=50,padR=50,padT=50,padB=46;
  const px = x => padL + x/100*(W-padL-padR);
  const py = y => H-padB - y/100*(H-padT-padB);
  const pts = opts.points;
  let path = pts.map((p,i)=>`${i===0?'M':'L'}${px(p[0]).toFixed(1)},${py(p[1]).toFixed(1)}`).join(' ');
  let area = path + ` L${px(pts[pts.length-1][0]).toFixed(1)},${py(0).toFixed(1)} L${px(pts[0][0]).toFixed(1)},${py(0).toFixed(1)} Z`;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="diagram" role="img" aria-label="Учебная схема">`;
  svg += `<rect width="100%" height="100%" rx="14" fill="#0b1410"/>`;
  svg += `<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6ee7a8" stop-opacity="0.28"/><stop offset="100%" stop-color="#6ee7a8" stop-opacity="0"/></linearGradient></defs>`;
  svg += `<g opacity=".35">${[0,1,2,3,4].map(i=>{const y=padT+i*(H-padT-padB)/4;return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#2a3a30"/>`;}).join('')}</g>`;
  (opts.zones||[]).forEach(z=>{
    svg += `<rect x="${px(z.x1)}" y="${py(z.y2)}" width="${px(z.x2)-px(z.x1)}" height="${py(z.y1)-py(z.y2)}" fill="${z.color||'#ffd76e'}" opacity="0.16"/>`;
    if(z.label) svg += `<text x="${px(z.x1)+8}" y="${py(z.y2)+20}" fill="${z.color||'#ffd76e'}" font-size="16" font-weight="700">${z.label}</text>`;
  });
  (opts.levels||[]).forEach(l=>{
    svg += `<line x1="${padL}" y1="${py(l.y)}" x2="${W-padR}" y2="${py(l.y)}" stroke="${l.color||'#9fc6ff'}" stroke-width="2.5" stroke-dasharray="${l.dashed===false?'0':'7 6'}"/>`;
    if(l.label) svg += `<text x="${padL}" y="${py(l.y)-10}" fill="${l.color||'#9fc6ff'}" font-size="16" font-weight="700">${l.label}</text>`;
  });
  svg += `<path d="${area}" fill="url(#g1)"/>`;
  svg += `<path d="${path}" fill="none" stroke="#6ee7a8" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  (opts.markers||[]).forEach(m=>{
    svg += `<circle cx="${px(m.x)}" cy="${py(m.y)}" r="8" fill="${m.color||'#ffd76e'}" stroke="#0b1410" stroke-width="2"/>`;
    const anchor = m.anchor||'middle';
    const dy = m.below ? 28 : -18;
    svg += `<text x="${px(m.x)}" y="${py(m.y)+dy}" fill="${m.color||'#ffd76e'}" font-size="18" font-weight="700" text-anchor="${anchor}">${m.label}</text>`;
  });
  if(opts.title) svg += `<text x="${padL}" y="28" fill="#9fc6ff" font-size="15" font-weight="700">${opts.title}</text>`;
  svg += `</svg>`;
  return svg;
}

function candleWithVolume(type, opts){
  let base = candleChart(type);
  // inject simple volume bars under existing chart by appending a secondary svg block
  const n=28; let bars='';
  for(let i=0;i<n;i++){ const h = 8 + Math.abs(Math.sin(i*1.7))*22; bars += `<rect x="${55+i*28.75}" y="${60-h}" width="16" height="${h}" fill="#3b604f"/>`; }

}

app.querySelector('#logout').onclick=async()=>{await api('/api/logout',{method:'POST',body:{}});me=null;progress={};scores={};try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_s')}catch(e){}await loadAll();go('home')};return}
let mode='login';
const draw=()=>{layout(`<div class="title"><span class="eyebrow">АККАУНТ</span><h1>${mode==='login'?'Вход':'Создать аккаунт'}</h1><p>${mode==='login'?'Войди, чтобы открыть купленные уроки и сохранить прогресс.':'Аккаунт нужен, чтобы доступ к курсу не потерялся и работал на любом устройстве.'}</p></div><div class="panel auth-box"><form id="authform" novalidate><label class="lbl">Почта<input class="field" id="em" type="email" autocomplete="email" maxlength="254" required></label><label class="lbl">Пароль${mode==='login'?'':' (минимум 8 символов)'}<input class="field" id="pw" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" maxlength="128" required></label>${mode==='login'?'':'<label class="chk"><input id="agree" type="checkbox"> Я принимаю <a href="/offer.html" target="_blank" rel="noopener">оферту</a> и <a href="/privacy.html" target="_blank" rel="noopener">политику конфиденциальности</a></label>'}<div class="auth-err" id="autherr" role="alert"></div><div class="actions"><button class="btn primary" type="submit" id="authgo">${mode==='login'?'Войти':'Создать аккаунт'}</button><button class="btn" type="button" id="switch">${mode==='login'?'У меня нет аккаунта':'У меня уже есть аккаунт'}</button></div></form></div>`,'account');
app.querySelector('#switch').onclick=()=>{mode=mode==='login'?'register':'login';draw()};
app.querySelector('#authform').addEventListener('submit',async e=>{e.preventDefault();const em=app.querySelector('#em').value.trim(),pw=app.querySelector('#pw').value,er=app.querySelector('#autherr');er.textContent='';if(mode==='register'&&!app.querySelector('#agree').checked){er.textContent='Нужно принять оферту и политику конфиденциальности.';return}const btn=app.querySelector('#authgo');btn.disabled=true;const r=await api(mode==='login'?'/api/login':'/api/register',{method:'POST',body:{email:em,password:pw}});btn.disabled=false;if(!r.ok){er.textContent=(r.data&&r.data.message)||'Не удалось связаться с сервером. Попробуй ещё раз.';return}await loadAll();await pullProgress();const nx=afterLogin||'courses';afterLogin=null;go(nx)});};
draw()}
function keyBox(){return me&&!me.paid?'<div class="key-box"><h3>Есть ключ доступа?</h3><div class="key-row"><input class="field" id="keyin" maxlength="20" placeholder="XXXX-XXXX-XXXX" autocomplete="off"><button class="btn primary" id="keygo">Активировать</button></div><div class="auth-err" id="keyerr" role="alert"></div></div>':''}
function keyInit(){const b=app.querySelector('#keygo');if(!b)return;b.onclick=async()=>{const er=app.querySelector('#keyerr');er.textContent='';b.disabled=true;const r=await api('/api/key/redeem',{method:'POST',body:{code:app.querySelector('#keyin').value}});b.disabled=false;if(r.ok){await loadAll();layout(`<div class="title"><span class="eyebrow">ДОСТУП</span><h1>Готово - полный доступ открыт</h1><p>Ключ активирован. Теперь тебе доступны все уроки курса.</p><div class="actions"><button class="btn primary" id="tocourses">Перейти к урокам →</button></div>${clubBlock()}</div>`,'courses');clubInit();app.querySelector('#tocourses').onclick=()=>go('courses')}else er.textContent=(r.data&&r.data.message)||'Не удалось связаться с сервером.'}}
function clubBlock(){return cfg.club&&me&&me.paid?'<div class="club-box"><button class="btn" id="clubbtn">Вступить в закрытый канал</button><div class="auth-err" id="cluberr" role="alert"></div><div id="clublink"></div></div>':''}
function clubInit(){const b=app.querySelector('#clubbtn');if(!b)return;b.onclick=async()=>{b.disabled=true;const er=app.querySelector('#cluberr');er.textContent='';const r=await api('/api/club/invite',{method:'POST',body:{}});b.disabled=false;if(r.ok&&r.data.link){b.style.display='none';const a=document.createElement('a');a.className='btn primary';a.href=r.data.link;a.target='_blank';a.rel='noopener';a.textContent='Открыть канал в Telegram →';app.querySelector('#clublink').appendChild(a)}else er.textContent=(r.data&&r.data.message)||'Не удалось получить ссылку.'}}
async function startPay(){const er=app.querySelector('#payerr');if(er)er.textContent='';const r=await api('/api/pay/create',{method:'POST',body:{}});if(r.ok&&r.data&&r.data.url){location.href=r.data.url;return}if(r.status===401){afterLogin='pricing';return go('account')}if(er)er.textContent=(r.data&&r.data.message)||'Оплата временно недоступна.'}
function pricing(){
const paid=me&&me.paid;
layout(`<div class="title"><span class="eyebrow">ПОЛНЫЙ ДОСТУП</span><h1>Весь курс WICKLY</h1><p>Первые ${cfg.freeLessons||3} урока бесплатны: сначала посмотри, потом решай.</p></div><div class="price-grid"><aside class="panel price-card"><div class="price-num">${cfg.price} ₽</div><div class="muted">один платёж, без подписки</div>${paid?'<p class="ok"><b>У тебя уже открыт полный доступ.</b></p><button class="btn primary wide" id="tocourses">К урокам →</button>':`<button class="btn primary wide" id="buy">${me?'Оплатить '+cfg.price+' ₽':'Войти и оплатить'}</button><button class="btn wide" id="tocourses">Бесплатные уроки</button><div class="auth-err" id="payerr" role="alert"></div>${keyBox()}${cfg.paymentMode==='mock'?'<div class="muted small-note">Тестовый режим: деньги не списываются.</div>':''}`}</aside><section class="price-points"><ul class="price-list"><li><b>${lessons.length} уроков в ${modules.length} модулях.</b> От устройства рынка и чтения свечей до структуры, SMC, паттернов, индикаторов, риска и разбора собственных ошибок.</li><li><b>В каждом уроке 6 сложных вопросов</b> с разбором типичной ошибки: ты проверяешь понимание, а не угадываешь.</li><li><b>Развёрнутые тексты для новичка:</b> определения, примеры с цифрами, частые заблуждения, схемы там, где они действительно помогают.</li><li><b>Словарь, практика и прогресс по модулям.</b> Результаты тестов сохраняются в аккаунте и доступны с любого устройства.</li></ul><p class="muted">Это обучение, а не торговые сигналы. Мы не обещаем прибыль: торговля на рынках связана с риском потери денег.</p></section></div>`,'courses');
app.querySelector('#tocourses').onclick=()=>go('courses');
keyInit();app.querySelector('#buy')?.addEventListener('click',()=>{if(!me){afterLogin='pricing';go('account')}else startPay()})}
async function payReturn(pid){
if(!/^[0-9a-f]{32}$/.test(pid))return go('home');
layout(`<div class="title"><span class="eyebrow">ОПЛАТА</span><h1>Проверяем оплату…</h1><p class="muted">Это занимает несколько секунд, не закрывай страницу.</p></div>`,'courses');
const my=navId;
for(let t=0;t<40;t++){const r=await api('/api/pay/status/'+pid);if(my!==navId)return;
if(r.status===401){afterLogin='pricing';return go('account')}
if(r.ok&&r.data.status==='succeeded'){await loadAll();layout(`<div class="title"><span class="eyebrow">ОПЛАТА</span><h1>Готово - полный доступ открыт</h1><p>Спасибо! Теперь тебе доступны все уроки курса.</p><div class="actions"><button class="btn primary" id="tocourses">Перейти к урокам →</button></div>${clubBlock()}</div>`,'courses');clubInit();app.querySelector('#tocourses').onclick=()=>go('courses');return}
if(r.ok&&r.data.status==='canceled'){layout(`<div class="title"><span class="eyebrow">ОПЛАТА</span><h1>Оплата не прошла</h1><p>Деньги не списаны. Можно попробовать ещё раз.</p><div class="actions"><button class="btn primary" id="again">Попробовать снова</button></div></div>`,'courses');app.querySelector('#again').onclick=()=>go('pricing');return}
await sleep(2000)}
layout(`<div class="title"><span class="eyebrow">ОПЛАТА</span><h1>Платёж ещё обрабатывается</h1><p>Если деньги списаны, доступ откроется в течение нескольких минут. Обнови страницу позже${cfg.telegram?' или напиши нам в Telegram':''}.</p></div>`,'courses')}

function tgBtn(){return TG_URL?`<a class="btn primary" href="${esc(TG_URL)}" target="_blank" rel="noopener">Подписаться на Telegram →</a>`:''}
function soon(){layout(`<div class="title"><span class="eyebrow">ПОЛНЫЙ КУРС</span><h1>Полная версия пока в разработке</h1><p>Первые 3 урока доступны бесплатно. Остальные уроки ещё доделываются.${TG_URL?' Подпишись на Telegram, чтобы не пропустить выход.':''}</p></div><div class="panel soon"><div class="actions" style="margin-top:0">${tgBtn()}<button class="btn" data-back="1">К урокам</button></div></div>`,'courses');app.querySelector('[data-back]').onclick=()=>go('courses')}
function go(r){navId++;if(r.startsWith('pay-return=')){return payReturn(r.slice(11))}
let [p,id]=r.split('#');
if(!lessons.length&&p!=='home'){} 
if(p==='home'||!p)home();else if(p==='courses')courses(id?decodeURIComponent(id):null);else if(p==='lesson')lesson(id);else if(p==='practice')practice();else if(p==='dictionary')dict();else if(p==='progress')prog();else if(p==='pricing'||p==='account')soon();else home();try{history.replaceState({},'',r==='home'?'#':'#'+r)}catch(e){}}
window.onpopstate=()=>go(location.hash.slice(1)||'home');
(async()=>{await loadAll();if(!lessons.length){app.innerHTML='<div class="shell"><main class="main"><div class="title"><h1>Не удалось загрузить курс</h1><p class="muted">Проверь интернет и обнови страницу.</p></div></main></div>';return}go(location.hash.slice(1)||'home')})();
</script></body></html>
